server:
  replicaCount: 2
  persistentVolume:
    enabled: false
  nodeSelector:
    node-type: addon
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: server
alertmanager:
  enabled: false
pushgateway:
  enabled: false
kube-state-metrics:
  nodeSelector:
    node-type: addon
prometheus-node-exporter:
  nodeSelector:
    node-type: addon
